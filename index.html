<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Masuk Portal DELIMa PPD Batu Pahat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .bg-custom-dark { background-color: #1e1e38; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

  <!-- Header -->
  <header class="bg-custom-dark text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="bg-yellow-500 text-gray-900 font-extrabold px-3 py-1 rounded text-xs uppercase">
          PPD Batu Pahat
        </div>
        <div>
          <h1 class="text-xl font-bold">Sistem Catatan Log Masuk DELIMa</h1>
        </div>
      </div>
      <button id="btnLogout" onclick="logout()" class="hidden bg-red-600 hover:bg-red-700 text-white text-xs px-3 py-1.5 rounded-lg font-bold transition flex items-center gap-1.5">
        <i class="fa-solid fa-right-from-bracket"></i> Log Keluar
      </button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8">

    <!-- Screen 1: Log Masuk -->
    <div id="loginScreen" class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-xl border border-gray-100 space-y-6">
      <div class="text-center space-y-2">
        <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto text-2xl shadow-inner">
          <i class="fa-solid fa-user-lock"></i>
        </div>
        <h2 class="text-xl font-bold text-gray-900">Log Masuk Sekolah</h2>
        <p class="text-xs text-gray-500">Masukkan Kod Sekolah anda untuk mengakses data (Contoh: JBA0081)</p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Kod Sekolah</label>
          <input type="text" id="inputKodSekolah" placeholder="Contoh: JBA0081" class="w-full text-sm font-mono uppercase tracking-wider border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <button onclick="doLogin()" id="btnLogin" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm py-3 rounded-lg transition shadow flex items-center justify-center gap-2">
          <i class="fa-solid fa-right-to-bracket"></i> Log Masuk
        </button>
      </div>
    </div>

    <!-- Screen 2: Dashboard Rekod Sekolah -->
    <div id="dashboardScreen" class="hidden space-y-6">
      
      <div class="bg-indigo-900 text-white p-6 rounded-2xl shadow-lg flex justify-between items-center">
        <div>
          <span class="bg-yellow-500 text-gray-900 text-[10px] font-extrabold px-2.5 py-0.5 rounded uppercase" id="badgeKod"></span>
          <h2 class="text-2xl font-bold mt-1" id="titleNamaSekolah"></h2>
        </div>
      </div>

      <!-- Scorecards -->
      <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
          <div class="text-xs font-semibold text-gray-500 uppercase">Jumlah Rekod</div>
          <div class="text-2xl font-bold text-gray-900 mt-1" id="statTotal">0</div>
        </div>
        <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-emerald-500 border-gray-200">
          <div class="text-xs font-semibold text-gray-500 uppercase">Selesai Catat</div>
          <div class="text-2xl font-bold text-emerald-600 mt-1" id="statCompleted">0</div>
        </div>
        <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-amber-500 border-gray-200">
          <div class="text-xs font-semibold text-gray-500 uppercase">Belum Dicatat</div>
          <div class="text-2xl font-bold text-amber-600 mt-1" id="statPending">0</div>
        </div>
        <div class="bg-white p-4 rounded-xl shadow-sm border-gray-200">
          <div class="text-xs font-semibold text-gray-500 uppercase">Rekod Murid</div>
          <div class="text-2xl font-bold text-blue-600 mt-1" id="statMurid">0</div>
        </div>
        <div class="bg-white p-4 rounded-xl shadow-sm border-gray-200">
          <div class="text-xs font-semibold text-gray-500 uppercase">Rekod Guru</div>
          <div class="text-2xl font-bold text-purple-600 mt-1" id="statGuru">0</div>
        </div>
      </div>

      <!-- Filters & Table -->
      <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden space-y-4 p-4">
        <div class="flex justify-between items-center border-b pb-4 gap-4">
          <div class="flex bg-gray-100 p-1 rounded-lg">
            <button id="tabAll" onclick="switchTab('Semua')" class="px-4 py-1.5 rounded-md text-xs font-semibold bg-white text-gray-800 shadow-sm">Semua</button>
            <button id="tabMurid" onclick="switchTab('Murid')" class="px-4 py-1.5 rounded-md text-xs font-semibold text-gray-600 hover:text-gray-900">Murid</button>
            <button id="tabGuru" onclick="switchTab('Guru')" class="px-4 py-1.5 rounded-md text-xs font-semibold text-gray-600 hover:text-gray-900">Guru</button>
          </div>
          <input type="text" id="searchInput" onkeyup="renderTable()" placeholder="Carian Nama / E-mel..." class="px-3 py-2 text-xs border border-gray-300 rounded-lg w-64">
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-gray-50 text-gray-600 text-[11px] uppercase border-b border-gray-200">
                <th class="p-3 w-12 text-center">Bil</th>
                <th class="p-3 w-20">Peranan</th>
                <th class="p-3">Nama Pengguna</th>
                <th class="p-3">E-mel DELIMa</th>
                <th class="p-3">Status</th>
                <th class="p-3 min-w-[180px]">Catatan</th>
                <th class="p-3 min-w-[180px]">Alasan</th>
                <th class="p-3 text-center">Tindakan</th>
              </tr>
            </thead>
            <tbody id="tableBody" class="divide-y divide-gray-100 text-xs text-gray-700"></tbody>
          </table>
        </div>
      </div>

    </div>

  </main>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxpshkYlIOZuzLOe1pvT5vhxKfG6tjZyRK0qrUeeAmlCSzn23BgK7mm1xkj3RoYmJiPZQ/exec";
    
    let schoolMasterData = [];
    let currentTab = "Semua";
    const CATATAN_OPTIONS = ["ID ke luar sekolah", "ID di sekolah", "ID Murid", "ID guru", "Telah login", "Lain-lain"];

    async function doLogin() {
      const kod = document.getElementById("inputKodSekolah").value.trim().toUpperCase();
      if (!kod) return alert("Sila masukkan Kod Sekolah!");

      const btn = document.getElementById("btnLogin");
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Memeriksa...`;

      try {
        const res = await fetch(`${SCRIPT_URL}?action=login&kodSekolah=${encodeURIComponent(kod)}`);
        const json = await res.json();

        if (json.status === "success") {
          schoolMasterData = json.data;
          document.getElementById("badgeKod").textContent = json.kodSekolah;
          document.getElementById("titleNamaSekolah").textContent = json.namaSekolah;

          document.getElementById("loginScreen").classList.add("hidden");
          document.getElementById("dashboardScreen").classList.remove("hidden");
          document.getElementById("btnLogout").classList.remove("hidden");

          updateScorecards();
          renderTable();
        } else {
          alert(json.message || "Kod Sekolah tidak dijumpai.");
        }
      } catch (e) {
        alert("Ralat sambungan.");
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-right-to-bracket"></i> Log Masuk`;
      }
    }

    function logout() {
      schoolMasterData = [];
      document.getElementById("inputKodSekolah").value = "";
      document.getElementById("loginScreen").classList.remove("hidden");
      document.getElementById("dashboardScreen").classList.add("hidden");
      document.getElementById("btnLogout").classList.add("hidden");
    }

    function renderTable() {
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = "";

      const search = document.getElementById("searchInput").value.toLowerCase();
      const filtered = schoolMasterData.filter(r => {
        const matchRole = currentTab === "Semua" || r.role === currentTab;
        const matchSearch = !search || r.nama.toLowerCase().includes(search) || r.email.toLowerCase().includes(search);
        return matchRole && matchSearch;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" class="p-8 text-center text-gray-400">Tiada rekod dijumpai.</td></tr>`;
        return;
      }

      filtered.forEach((item, idx) => {
        const tr = document.createElement("tr");
        tr.className = "hover:bg-gray-50 transition border-b border-gray-100";
        const isCustom = item.catatan === "Lain-lain";
        const rowId = `row-${item.role}-${idx}`;

        tr.innerHTML = `
          <td class="p-3 text-center text-gray-400 font-mono">${idx + 1}</td>
          <td class="p-3">
            <span class="px-2 py-0.5 text-[10px] font-bold rounded-full ${item.role === 'Murid' ? 'bg-blue-100 text-blue-700' : 'bg-purple-100 text-purple-700'}">
              ${item.role}
            </span>
          </td>
          <td class="p-3 font-semibold text-gray-900">${item.nama}</td>
          <td class="p-3 font-mono text-gray-600">${item.email}</td>
          <td class="p-3"><span class="px-2 py-0.5 text-[10px] font-medium rounded-full bg-red-50 text-red-600 border border-red-100">${item.status}</span></td>
          <td class="p-3">
            <select id="selectCatatan-${rowId}" onchange="toggleAlasanField('${rowId}')" class="w-full border rounded p-1.5 text-xs">
              <option value="">-- Pilih Catatan --</option>
              ${CATATAN_OPTIONS.map(opt => `<option value="${opt}" ${item.catatan === opt ? 'selected' : ''}>${opt}</option>`).join('')}
            </select>
          </td>
          <td class="p-3">
            <input type="text" id="inputAlasan-${rowId}" value="${item.alasan || ''}" ${isCustom ? '' : 'disabled'} placeholder="${isCustom ? 'Nyatakan Alasan...' : '-'}" class="w-full border rounded p-1.5 text-xs ${isCustom ? 'bg-white' : 'bg-gray-100 text-gray-400'}">
          </td>
          <td class="p-3 text-center">
            <button id="btnSave-${rowId}" onclick="saveSingleRow('${item.email}', '${item.role}', '${rowId}')" class="bg-indigo-600 hover:bg-indigo-700 text-white text-[11px] px-3 py-1.5 rounded-md font-medium transition shadow flex items-center gap-1 mx-auto">
              <i class="fa-solid fa-floppy-disk"></i> Simpan
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function toggleAlasanField(rowId) {
      const select = document.getElementById(`selectCatatan-${rowId}`);
      const input = document.getElementById(`inputAlasan-${rowId}`);
      if (select.value === "Lain-lain") {
        input.disabled = false;
        input.classList.remove("bg-gray-100", "text-gray-400");
        input.classList.add("bg-white");
      } else {
        input.disabled = true;
        input.value = "";
        input.classList.add("bg-gray-100", "text-gray-400");
      }
    }

    async function saveSingleRow(email, role, rowId) {
      const select = document.getElementById(`selectCatatan-${rowId}`);
      const input = document.getElementById(`inputAlasan-${rowId}`);
      const btn = document.getElementById(`btnSave-${rowId}`);

      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i>`;

      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({ action: "updateRow", role: role, email: email, catatan: select.value, alasan: input.value })
        });
        const json = await res.json();

        if (json.status === "success") {
          const item = schoolMasterData.find(r => r.email === email && r.role === role);
          if (item) { item.catatan = select.value; item.alasan = input.value; }
          btn.className = "bg-emerald-600 text-white text-[11px] px-3 py-1.5 rounded-md font-medium shadow flex items-center gap-1 mx-auto";
          btn.innerHTML = `<i class="fa-solid fa-check"></i> Tersimpan`;
          setTimeout(() => {
            btn.className = "bg-indigo-600 hover:bg-indigo-700 text-white text-[11px] px-3 py-1.5 rounded-md font-medium transition shadow flex items-center gap-1 mx-auto";
            btn.innerHTML = `<i class="fa-solid fa-floppy-disk"></i> Simpan`;
            btn.disabled = false;
          }, 1500);
          updateScorecards();
        }
      } catch (e) {
        alert("Ralat simpan.");
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-floppy-disk"></i> Simpan`;
      }
    }

    function updateScorecards() {
      const total = schoolMasterData.length;
      const completed = schoolMasterData.filter(r => !!r.catatan).length;
      document.getElementById("statTotal").textContent = total;
      document.getElementById("statCompleted").textContent = completed;
      document.getElementById("statPending").textContent = total - completed;
      document.getElementById("statMurid").textContent = schoolMasterData.filter(r => r.role === "Murid").length;
      document.getElementById("statGuru").textContent = schoolMasterData.filter(r => r.role === "Guru").length;
    }

    function switchTab(tab) {
      currentTab = tab;
      ["All", "Murid", "Guru"].forEach(t => {
        const btn = document.getElementById(`tab${t}`);
        btn.className = ((t === "All" && tab === "Semua") || t === tab) ? "px-4 py-1.5 rounded-md text-xs font-semibold bg-white text-gray-800 shadow-sm" : "px-4 py-1.5 rounded-md text-xs font-semibold text-gray-600 hover:text-gray-900";
      });
      renderTable();
    }
  </script>
</body>
</html>
